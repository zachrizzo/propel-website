<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Propel</title>
  <defs>
    <linearGradient id="blade-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00e5ff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00b8d4;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blade-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#2196f3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1976d2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blade-deep-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1565c0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d47a1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="blade-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5e35b1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#4527a0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded black square background -->
  <rect width="512" height="512" rx="115" fill="#0f0f0f"/>
  
  <!-- Center hub -->
  <circle cx="256" cy="256" r="32" fill="#00e5ff"/>
  
  <!-- Four propeller blades -->
  <!-- Top-left blade (cyan) -->
  <ellipse cx="170" cy="170" rx="100" ry="45" transform="rotate(-45 170 170)" fill="url(#blade-cyan)"/>
  
  <!-- Top-right blade (arrow - blue) -->
  <path d="M 256 256 L 380 200 L 390 220 L 350 235 L 385 270 L 370 285 L 335 250 L 320 290 Z" fill="url(#blade-blue)"/>
  
  <!-- Bottom-right blade (deep blue) -->
  <ellipse cx="342" cy="342" rx="100" ry="45" transform="rotate(45 342 342)" fill="url(#blade-deep-blue)"/>
  
  <!-- Bottom-left blade (purple) -->
  <ellipse cx="170" cy="342" rx="100" ry="45" transform="rotate(-45 170 342)" fill="url(#blade-purple)"/>
  
  <!-- Shine/gloss effect on hub -->
  <circle cx="248" cy="248" r="12" fill="white" opacity="0.4"/>
</svg>
